name: Sah Factory Integrity
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  scaffold-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate scaffold metadata and secrets
        run: python -m harness check --repo .
      - name: Compile harness
        run: python -m compileall -q harness
