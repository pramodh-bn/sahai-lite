name: Sah Factory Integrity
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
permissions:
  contents: read
jobs:
  scaffold-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Get full history for Git SHA
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate scaffold metadata and secrets
        run: python -m harness check --repo .
      - name: Compile harness
        run: python -m compileall -q harness
      - name: Verify ADR 0001 base image digest
        run: |
          docker buildx imagetools inspect python:3.12.16-slim-bookworm@sha256:44cf1793efa7c7a476bb0f2cff81443f4a072c90c1cb127e2924933daa3e8c64 \
            --format "{{json .Manifest}}" > base-image-manifest.json
          cat base-image-manifest.json
          echo "Base image verification complete"
      - name: Stage 1 Docker build and smoke test
        if: ${{ hashFiles('app/Dockerfile') != '' }}
        run: |
          # Get current Git SHA for build metadata
          GIT_SHA=$(git rev-parse HEAD)
          echo "Building with Git SHA: $GIT_SHA"
          
          # Build Docker image with build arguments
          docker build \
            --platform linux/amd64 \
            --build-arg GIT_SHA="$GIT_SHA" \
            --build-arg APP_VERSION="1.0.0" \
            --build-arg SERVICE_NAME="sah" \
            --build-arg MODE="MOCK" \
            -t sah-stage1:$GIT_SHA \
            ./app
          
          echo "Build complete, image: sah-stage1:$GIT_SHA"
          
          # Run container with ephemeral port (ADR 0001 requirement)
          CONTAINER_NAME="sah-harness-$GIT_SHA"
          docker run -d \
            --name "$CONTAINER_NAME" \
            --publish 127.0.0.1::8080 \
            sah-stage1:$GIT_SHA
          
          # Get container ID and verify running state
          CONTAINER_ID=$(docker ps -q -f name="$CONTAINER_NAME")
          echo "Container ID: $CONTAINER_ID"
          docker inspect "$CONTAINER_NAME" --format='{{.State.Status}}'
          
          # Verify exact container identity before probing
          if [ "$(docker inspect "$CONTAINER_NAME" --format='{{.State.Status}}')" != "running" ]; then
            echo "ERROR: Container not running"
            exit 1
          fi
          
          # Get ephemeral host port
          HOST_PORT=$(docker port "$CONTAINER_NAME" 8080/tcp | cut -d: -f2)
          BASE_URL="http://127.0.0.1:$HOST_PORT"
          echo "Service available at: $BASE_URL"
          
          # Wait for service to be ready
          echo "Waiting for service to be ready..."
          sleep 5
          
          # Test health endpoint
          echo "Testing /health endpoint..."
          curl -f -s "$BASE_URL/health" | jq .
          
          # Test version endpoint
          echo "Testing /version endpoint..."
          VERSION_RESPONSE=$(curl -f -s "$BASE_URL/version")
          echo "$VERSION_RESPONSE" | jq .
          
          # Verify version response contains required ADR 0001 fields
          echo "$VERSION_RESPONSE" | jq -e '.service == "sah"' > /dev/null
          echo "$VERSION_RESPONSE" | jq -e '.git_sha' > /dev/null
          echo "$VERSION_RESPONSE" | jq -e '.mode' > /dev/null
          
          echo "Basic endpoint tests passed"
          
          # Run harness smoke test
          echo "Running harness smoke test..."
          python -m harness run --repo . --stage 1 --base-url "$BASE_URL" --smoke-only || true
          
          # Cleanup - remove exact container
          docker rm -f "$CONTAINER_NAME"
          
          echo "Stage 1 smoke test complete"